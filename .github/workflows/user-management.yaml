name: Deploy User Management Page

on:
  push:
    branches:
      - main
      - stage
    paths:
      - apps/user-management/**
      - packages/**
      - .github/workflows/user-management.yaml
      - turbo.json
  pull_request:
    branches:
      - main
      - stage
    paths:
      - apps/user-management/**
      - packages/**
      - .github/workflows/user-management.yaml

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: NPM Install
        run: npm i

      - name: Check
        run: npm run check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: NPM Install
        run: npm i

      - name: Build
        run: npx turbo run @lcax/user-management#build
        env:
          VITE_UMAMI_ID: ${{ secrets.SEARCH_UMAMI_ID }}
          VITE_BACKEND_URL: "https://api.lcax.tools"
          FRONTEND_URL: "https://search.lcax.tools"

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: ./apps/user-management/dist

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - check
    if: github.event_name != 'pull_request'
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: app

      - name: Install RustFS rc
        run: |
          curl -fsSL https://github.com/rustfs/cli/releases/download/v0.1.37/rustfs-cli-linux-amd64-v0.1.37.tar.gz \
            | tar xz -C "$RUNNER_TEMP" rc
          sudo install "$RUNNER_TEMP/rc" /usr/local/bin/rc

      - name: Upload to Bundle
        env:
          ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY }}
          SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
        run: |
          rc alias set bundle https://files.chrk.site "$ACCESS_KEY_ID" "$SECRET_ACCESS_KEY"
          rc cp --recursive ./ "bundle/bundles/lcax/${{ github.ref_name }}/user-management/"
