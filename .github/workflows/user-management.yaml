name: Deploy User Management Page

on:
  push:
    branches:
      - main
      - stage
    paths:
      - apps/user-management/**
      - packages/**
      - .github/workflows/user-management.yaml
      - turbo.json
  pull_request:
    branches:
      - main
      - stage
    paths:
      - apps/user-management/**
      - packages/**
      - .github/workflows/user-management.yaml

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: NPM Install
        run: npm i

      - name: Check
        run: npm run check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: NPM Install
        run: npm i

      - name: Build
        run: npx turbo run @lcax/user-management#build
        env:
          VITE_UMAMI_ID: ${{ secrets.SEARCH_UMAMI_ID }}
          VITE_BACKEND_URL: "https://api.lcax.tools"

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: ./apps/user-management/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: app

      - name: Install s5cmd
        run: |
          curl -L https://github.com/peak/s5cmd/releases/download/v2.3.0/s5cmd_2.3.0_Linux-64bit.tar.gz \
            | tar xz
          sudo mv s5cmd /usr/local/bin/

      - name: Upload to Bundle
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_REGION: us-east-1
        run: s5cmd --endpoint-url https://minio.chrk.site cp "./*" "s3://bundles/lcax/${{ github.ref_name }}/user-management/"